<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For My Princess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Mulish:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#FFF6F3;
    --surface:#FFFFFF;
    --surface-2:#FFEFEA;
    --ink:#3A2230;
    --muted:#8C6B78;
    --accent:#D6577A;
    --accent-2:#F3AFC2;
    --accent-deep:#9C2F52;
    --gold:#B98A3C;
    --border:#F0D9DE;
    --shadow:0 14px 34px -14px rgba(156,47,82,.28);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E0F17; --surface:#2A1420; --surface-2:#341A28; --ink:#F8E7EE;
      --muted:#CE9FB1; --accent:#F2789C; --accent-2:#7A2E45; --accent-deep:#F6A9C1;
      --gold:#DDBD79; --border:#4A2436; --shadow:0 14px 34px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E0F17; --surface:#2A1420; --surface-2:#341A28; --ink:#F8E7EE;
    --muted:#CE9FB1; --accent:#F2789C; --accent-2:#7A2E45; --accent-deep:#F6A9C1;
    --gold:#DDBD79; --border:#4A2436; --shadow:0 14px 34px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Mulish',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:18px;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:calc(100vh - 36px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #login-screen[hidden], #app[hidden]{ display:none; }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:36px 28px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .login-card .bloom{
    width:64px;height:64px;margin:0 auto 14px;
  }
  .login-card h1{font-size:1.7rem;color:var(--accent-deep);}
  .login-card p{color:var(--muted);font-size:.95rem;margin:8px 0 22px;}
  #passcode-form{display:flex;flex-direction:column;gap:12px;}
  .passcode-field{position:relative;}
  #passcode-input{
    width:100%;
    font-size:1.4rem;
    letter-spacing:.35em;
    text-align:center;
    padding:14px 44px 14px 10px;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    font-family:'Mulish',sans-serif;
    font-weight:700;
  }
  #passcode-input:focus{outline:2px solid var(--accent);outline-offset:2px;}
  #toggle-passcode{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:1.15rem;
    padding:6px;line-height:1;color:var(--muted);
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:14px;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(214,87,122,.6);
  }
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:focus-visible, button:focus-visible, input:focus-visible, .nav-btn:focus-visible{
    outline:2px solid var(--accent-deep); outline-offset:2px;
  }
  #login-error{color:var(--accent-deep);font-size:.88rem;min-height:1.2em;font-weight:700;}

  /* ---------- App shell ---------- */
  #app{max-width:760px;margin:0 auto;}
  header#topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:14px;
  }
  header#topbar .who{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--muted);}
  #lock-btn{
    background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.85rem;
  }
  nav#tabs{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    background:var(--surface);border:1px solid var(--border);
    border-radius:18px;padding:8px;box-shadow:var(--shadow);margin-bottom:18px;
    position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  }
  .nav-btn{
    border:none;background:transparent;color:var(--muted);
    padding:9px 14px;border-radius:12px;font-weight:800;font-size:.86rem;
    cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .nav-btn.active{background:var(--accent);color:#fff;}
  .tab{display:none;animation:fadeIn .35s ease;}
  .tab.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:22px;padding:22px;box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .muted{color:var(--muted);}
  .eyebrow{
    text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;
    font-weight:800;color:var(--accent-deep);
  }

  /* ---------- Home ---------- */
  #greeting-name{color:var(--accent-deep);}
  #today-note{margin-top:10px;font-style:italic;color:var(--muted);}
  .bouquet-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .bouquet-wrap svg{width:150px;height:170px;flex:none;}
  .bouquet-caption{flex:1;min-width:180px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:8px;}
  .stat-pill{
    background:var(--surface-2);border-radius:16px;padding:14px 16px;text-align:center;
  }
  .stat-pill .n{font-size:1.5rem;font-weight:800;color:var(--accent-deep);}
  .stat-pill .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .meet-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;}
  .meet-row label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px;}
  .meet-row input{
    padding:10px;border-radius:12px;border:1.5px solid var(--border);
    background:var(--surface-2);color:var(--ink);font-family:inherit;
  }
  .btn-ghost{
    background:var(--surface-2);border:1.5px solid var(--border);color:var(--accent-deep);
    padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer;
  }
  #meet-countdown{margin-top:12px;font-size:1.05rem;}

  /* ---------- Photo bubbles ---------- */
  #bubble-field{
    position:relative;height:420px;overflow:hidden;border-radius:22px;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
  }
  .bubble{
    position:absolute;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:#fff;text-align:center;font-size:.68rem;font-weight:800;
    box-shadow:0 10px 22px -10px rgba(0,0,0,.35);
    cursor:pointer;border:3px solid rgba(255,255,255,.6);
    animation:floaty linear infinite alternate;padding:6px;
  }
  .bubble svg{width:34%;height:34%;margin-bottom:4px;opacity:.9;}
  @keyframes floaty{
    from{transform:translateY(0) translateX(0) rotate(-2deg);}
    to{transform:translateY(-22px) translateX(10px) rotate(2deg);}
  }
  #photo-modal{
    position:fixed;inset:0;background:rgba(30,10,18,.55);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  #photo-modal.show{display:flex;}
  #photo-modal .box{
    background:var(--surface);border-radius:20px;padding:22px;max-width:320px;text-align:center;
  }

  /* ---------- Puzzle ---------- */
  #puzzle-area{
    position:relative;width:100%;max-width:520px;margin:0 auto;
    aspect-ratio:480/390;
  }
  #puzzle-tray, #puzzle-board{position:absolute;inset:0;}
  #puzzle-board{border-radius:16px;border:2px dashed var(--border);}
  .piece{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
  .piece.placed{cursor:default;}
  #puzzle-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  #puzzle-win{
    text-align:center;font-weight:800;color:var(--accent-deep);margin-top:10px;min-height:1.4em;
  }

  /* ---------- Calendar ---------- */
  #cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  #cal-head button{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:6px 12px;cursor:pointer;color:var(--accent-deep);font-weight:800;
  }
  #cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:.68rem;color:var(--muted);font-weight:800;text-transform:uppercase;}
  .cal-day{
    aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:.82rem;position:relative;
    background:var(--surface-2);
  }
  .cal-day.empty{background:transparent;}
  .cal-day.today{outline:2px solid var(--accent);}
  .cal-day.special{background:var(--accent-2);color:var(--accent-deep);font-weight:800;}
  .cal-day .dot{position:absolute;bottom:4px;font-size:.6rem;}
  #cal-legend{margin-top:10px;font-size:.78rem;color:var(--muted);}

  /* ---------- Coloring ---------- */
  #color-canvas-wrap{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1;}
  #paint-canvas,#lineart-canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;}
  #lineart-canvas{pointer-events:none;}
  #paint-canvas{background:#fff;touch-action:none;}
  #palette{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;justify-content:center;}
  .swatch{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;
  }
  .swatch.active{outline:2px solid var(--accent-deep);outline-offset:2px;}
  #tmpl-row,#brush-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}

  /* ---------- Watch ---------- */
  #watch-card{text-align:center;}
  #watch-line{font-family:'Cormorant Garamond',serif;font-size:1.3rem;margin:14px 0 20px;color:var(--accent-deep);}
  .netflix-btn{
    display:inline-block;background:#B3123B;color:#fff;text-decoration:none;
    padding:14px 26px;border-radius:14px;font-weight:800;box-shadow:0 10px 22px -10px rgba(179,18,59,.7);
  }

  @media (prefers-reduced-motion: reduce){
    .bubble,.tab{animation:none;}
  }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <svg class="bloom" viewBox="0 0 100 100" id="login-bloom"></svg>
    <h1>For My <span id="login-name">Princess</span></h1>
    <p>A little private world, just for you.<br>Enter the passcode to come in.</p>
    <form id="passcode-form" autocomplete="off">
      <div class="passcode-field">
        <input id="passcode-input" type="password" inputmode="numeric" maxlength="12" placeholder="passcode" aria-label="Passcode" autocomplete="off">
        <button type="button" id="toggle-passcode" aria-label="Show passcode" aria-pressed="false">👁️</button>
      </div>
      <button type="submit" class="btn-primary">Come in 💗</button>
      <div id="login-error" role="alert"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header id="topbar">
    <span class="who">for <strong id="header-name">you</strong></span>
    <button id="lock-btn" type="button">🔒 Lock</button>
  </header>

  <nav id="tabs">
    <button class="nav-btn active" data-tab="home" type="button">🏡 Home</button>
    <button class="nav-btn" data-tab="photos" type="button">💗 Photos</button>
    <button class="nav-btn" data-tab="puzzle" type="button">🧩 Puzzle</button>
    <button class="nav-btn" data-tab="calendar" type="button">📅 Calendar</button>
    <button class="nav-btn" data-tab="color" type="button">🎨 Color</button>
    <button class="nav-btn" data-tab="watch" type="button">🎬 Watch</button>
  </nav>

  <main>
    <!-- HOME -->
    <section class="tab active" id="tab-home">
      <div class="card">
        <p class="eyebrow" id="home-date"></p>
        <h2 style="font-size:1.6rem;">Hello, <span id="greeting-name"></span></h2>
        <p id="today-note"></p>
      </div>

      <div class="card">
        <p class="eyebrow">Today's bouquet</p>
        <div class="bouquet-wrap">
          <svg id="bouquet-svg" viewBox="0 0 200 220" aria-label="Today's flower bouquet"></svg>
          <div class="bouquet-caption">
            <h3 id="bouquet-name" style="font-size:1.3rem;color:var(--accent-d

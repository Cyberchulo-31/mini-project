<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For My Princess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Mulish:wght@400;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --bg:#FFF6F3;
    --surface:#FFFFFF;
    --surface-2:#FFEFEA;
    --ink:#3A2230;
    --muted:#8C6B78;
    --accent:#D6577A;
    --accent-2:#F3AFC2;
    --accent-deep:#9C2F52;
    --gold:#B98A3C;
    --border:#F0D9DE;
    --shadow:0 14px 34px -14px rgba(156,47,82,.28);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E0F17; --surface:#2A1420; --surface-2:#341A28; --ink:#F8E7EE;
      --muted:#CE9FB1; --accent:#F2789C; --accent-2:#7A2E45; --accent-deep:#F6A9C1;
      --gold:#DDBD79; --border:#4A2436; --shadow:0 14px 34px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E0F17; --surface:#2A1420; --surface-2:#341A28; --ink:#F8E7EE;
    --muted:#CE9FB1; --accent:#F2789C; --accent-2:#7A2E45; --accent-deep:#F6A9C1;
    --gold:#DDBD79; --border:#4A2436; --shadow:0 14px 34px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Mulish',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:18px;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:calc(100vh - 36px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #login-screen[hidden], #app[hidden]{ display:none; }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:36px 28px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .login-card .bloom{
    width:64px;height:64px;margin:0 auto 14px;
  }
  .login-card h1{font-size:1.7rem;color:var(--accent-deep);}
  .login-card p{color:var(--muted);font-size:.95rem;margin:8px 0 22px;}
  #passcode-form{display:flex;flex-direction:column;gap:12px;}
  .passcode-field{position:relative;}
  #passcode-input{
    width:100%;
    font-size:1.4rem;
    letter-spacing:.35em;
    text-align:center;
    padding:14px 44px 14px 10px;
